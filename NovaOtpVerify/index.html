<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova OTP Verification</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f8fc;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background:
          radial-gradient(circle at 16% 20%, rgba(31, 122, 236, 0.18), transparent 30%),
          linear-gradient(135deg, #eef5ff 0%, #f8fbff 48%, #eaf7f2 100%);
      }

      main {
        width: min(440px, 100%);
        background: #ffffff;
        border: 1px solid #d9e4f2;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 22px 60px rgba(18, 31, 53, 0.18);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 24px;
        background: #101828;
        color: #ffffff;
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #1f7aec;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.1;
        font-weight: 800;
      }

      .brand-subtitle {
        margin: 4px 0 0;
        color: #c8d2e3;
        font-size: 13px;
      }

      .content {
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #536273;
        line-height: 1.5;
      }

      .notice {
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #b7d7ff;
        border-radius: 8px;
        background: #eff7ff;
        color: #28496f;
        font-size: 13px;
      }

      label {
        display: block;
        margin-top: 20px;
        font-size: 13px;
        font-weight: 700;
        color: #344054;
      }

      input {
        width: 100%;
        margin-top: 8px;
        border: 1px solid #bcc8d6;
        border-radius: 8px;
        padding: 13px;
        font-size: 22px;
        letter-spacing: 4px;
        text-align: center;
        text-transform: uppercase;
      }

      input:focus {
        border-color: #1f7aec;
        outline: none;
        box-shadow: 0 0 0 3px rgba(31, 122, 236, 0.16);
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        background: #1f7aec;
        color: #ffffff;
        padding: 13px 14px;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #1767cc;
      }

      button:disabled {
        cursor: not-allowed;
        background: #8bbcf7;
        opacity: 1;
      }

      .result {
        min-height: 24px;
        margin-top: 16px;
        border-radius: 8px;
        background: #f6f8fb;
        padding: 12px;
        color: #3d4a5c;
      }

      .result.success {
        background: #effaf3;
        color: #14532d;
      }

      .result.error {
        background: #fff5f5;
        color: #b42318;
      }

      .footer {
        padding: 14px 24px;
        border-top: 1px solid #eef2f7;
        color: #667085;
        font-size: 12px;
        background: #fbfcfe;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="header">
        <div class="mark">NP</div>
        <div>
          <p class="brand-name">NovaPay</p>
          <p class="brand-subtitle">Secure OTP verification</p>
        </div>
      </section>

      <section class="content">
        <h1>Verify Your Code</h1>
        <p>Enter the code sent to your registered WhatsApp number.</p>
        <p class="notice">Do not say this code aloud or share it in the conversation.</p>

        <label for="otp">Verification code</label>
        <input id="otp" maxlength="12" autocomplete="one-time-code" autofocus />

        <button id="submit" type="button">Verify</button>
        <div class="result" id="result">Waiting for verification code.</div>
      </section>

      <footer class="footer">NovaPay secure verification for demo use only</footer>
    </main>

    <script>
      const VERIFY_ENDPOINT = "https://custotpverify-472738403194.asia-southeast1.run.app";
      const params = new URLSearchParams(window.location.search);
      const interactionId = params.get("interactionId") || params.get("id");
      const otp = document.getElementById("otp");
      const submit = document.getElementById("submit");
      const result = document.getElementById("result");

      function show(message, type) {
        result.textContent = message;
        result.className = "result" + (type ? ` ${type}` : "");
      }

      if (!interactionId) {
        show("This verification link is missing an interaction ID. Please ask the agent to send a new link.", "error");
        otp.disabled = true;
        submit.disabled = true;
      }

      submit.addEventListener("click", async () => {
        const code = otp.value.trim().toUpperCase();

        if (!code) {
          show("Please enter the verification code.", "error");
          return;
        }

        submit.disabled = true;
        otp.disabled = true;
        show("Submitted. Please return to the payment conversation.", "success");

        try {
          await fetch(VERIFY_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              interactionId,
              otp: code
            })
          });
        } catch (error) {
          show("Submitted. Please return to the payment conversation.", "success");
        }
      });
    </script>
  </body>
</html>
