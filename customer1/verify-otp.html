<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBS Secure OTP Verification</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f9;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.92)),
          url("DBS%20Demo%20Website.png") top center / cover no-repeat;
      }

      main {
        width: min(440px, 100%);
        background: #ffffff;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 20px 55px rgba(20, 28, 40, 0.18);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 92px;
        height: auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #536273;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-top: 20px;
        font-size: 13px;
        font-weight: 700;
        color: #3d4a5c;
      }

      input {
        width: 100%;
        margin-top: 8px;
        border: 1px solid #bcc8d6;
        border-radius: 6px;
        padding: 13px;
        font-size: 22px;
        letter-spacing: 4px;
        text-align: center;
        text-transform: uppercase;
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 6px;
        background: #d71920;
        color: #ffffff;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      .result {
        min-height: 24px;
        margin-top: 16px;
        border-radius: 6px;
        background: #f6f8fb;
        padding: 12px;
        color: #3d4a5c;
      }

      .result.success {
        background: #edfdf6;
        color: #126c5b;
      }

      .result.error {
        background: #fff5f5;
        color: #b5121b;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="dbs_logo.svg" alt="DBS Bank" />
      </div>
      <h1>Secure OTP Verification</h1>
      <p>Enter the code sent to your registered WhatsApp number. Do not say this code aloud or share it in the conversation.</p>

      <label for="otp">Verification code</label>
      <input id="otp" maxlength="12" autocomplete="one-time-code" autofocus />

      <button id="submit" type="button">Verify</button>
      <div class="result" id="result">Waiting for verification code.</div>
    </main>

    <script>
      const VERIFY_ENDPOINT = "https://custotpverify-472738403194.asia-southeast1.run.app";
      const params = new URLSearchParams(window.location.search);
      const interactionId = params.get("interactionId");
      const otp = document.getElementById("otp");
      const submit = document.getElementById("submit");
      const result = document.getElementById("result");

      function show(message, type) {
        result.textContent = message;
        result.className = "result" + (type ? ` ${type}` : "");
      }

      if (!interactionId) {
        show("This verification link is missing an interaction ID. Please ask the agent to send a new link.", "error");
        otp.disabled = true;
        submit.disabled = true;
      }

      submit.addEventListener("click", async () => {
        const code = otp.value.trim().toUpperCase();

        if (!code) {
          show("Please enter the verification code.", "error");
          return;
        }

        submit.disabled = true;
        show("Verifying code...");

        try {
          const response = await fetch(VERIFY_ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              interactionId,
              otp: code
            })
          });
          const payload = await response.json();

          if (payload.verification_status === "verified") {
            show("Verification complete. You may return to the banking conversation.", "success");
            otp.disabled = true;
            return;
          }

          show("Verification failed. Please check the code or ask the agent to resend it.", "error");
          submit.disabled = false;
        } catch (error) {
          show("Unable to verify right now. Please try again.", "error");
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
