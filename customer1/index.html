<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webex Contact Center Demo - DBS Bank</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />

  <style>
    body {
      background: #f4f5f7;
    }

    .dbs-page {
      position: relative;
      min-height: 100vh;
    }

    .dbs-demo-image {
      display: block;
      width: 100%;
      min-height: 100vh;
      object-fit: cover;
      object-position: top center;
    }

    .dbs-home-link {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      color: #1d1d1f;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(8px);
    }

    .dbs-home-link:hover,
    .dbs-home-link:focus {
      color: #d71920;
      background: #ffffff;
    }

    .dbs-home-link img {
      width: 72px;
      height: auto;
    }

    .sidebar-header {
      background-color: #d71920;
    }

    .whatsapp-qr {
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
    }

    .whatsapp-qr img {
      width: 220px;
      height: 220px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      background: #ffffff;
    }

    .whatsapp-qr .btn {
      background: #25d366;
      border-color: #25d366;
      color: #ffffff;
      font-weight: 700;
    }

    button.contact-link {
      width: calc(100% - 20px);
      text-align: left;
    }

    #notificationOffcanvasIndependent {
      --bs-offcanvas-width: 320px;
    }

    #notificationOffcanvasIndependent .offcanvas-header {
      background: #d71920;
      color: #ffffff;
    }

    #notificationSidebarIconTrigger {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 1060;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #ffffff;
      border: 0;
      border-radius: 50%;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #notificationSidebarIconTrigger:hover,
    #notificationSidebarIconTrigger:focus {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
    }

    #notificationSidebarIconTrigger img {
      width: 26px;
      height: 26px;
    }

    .notification-preview {
      padding: 12px;
      color: #4b5563;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .dbs-home-link {
        top: 10px;
        left: 10px;
        padding: 8px 10px;
      }

      .dbs-home-link img {
        width: 58px;
      }
    }
  </style>
</head>
<body>
  <main class="dbs-page">
    <a class="dbs-home-link" href="../index.html" aria-label="Back to WxCC Demo home">
      <img src="dbs_logo.svg" alt="DBS Bank" />
      <span>WxCC Demo</span>
    </a>

    <img class="dbs-demo-image" src="DBS%20Demo%20Website.png" alt="DBS Bank demo website" />
  </main>

  <div class="contact-sidebar" id="contactSidebar">
    <div class="sidebar-header" tabindex="0" role="button" aria-expanded="false" aria-label="Toggle Contact Sidebar">
      <div class="toggle-btn">
        <img src="../assets/ContactUs.png" alt="Contact Us Icon" />
      </div>
      <span class="header-text">Contact Us</span>
    </div>

    <div class="contact-links">
      <a href="tel:+6560478485" class="contact-link" data-bs-toggle="tooltip" title="Call Us">
        <img src="../assets/Phone.jpg" alt="Phone Icon" />
        +65 6047 8485
      </a>
      <button type="button" class="contact-link" id="whatsappQrLink" data-bs-toggle="tooltip" title="WhatsApp QR">
        <img src="../assets/contact-us-whatsapp.jpeg" alt="WhatsApp Icon" />
        +1 (207) 680-3454
      </button>
      <a href="mailto:cxdemosc@gmail.com" class="contact-link" data-bs-toggle="tooltip" title="Email">
        <img src="../assets/contact-us-email.jpg" alt="Email Icon" />
        sc01customer@gmail.com
      </a>
      <a href="#" class="contact-link" data-bs-toggle="tooltip" title="Office Address">
        <img src="../assets/adresspin.png" alt="Address Icon" />
        80, Pasir Panjang Road
      </a>
      <a href="https://www.webex.ai/" target="_blank" rel="noopener" class="contact-link" data-bs-toggle="tooltip" title="Webex AI">
        <img src="../assets/webex-logo.png" alt="Webex Home" />
        Webex
      </a>
    </div>
  </div>

  <div class="modal fade" id="whatsappQrModal" tabindex="-1" aria-labelledby="whatsappQrTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="whatsappQrTitle">WhatsApp Chat</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="whatsapp-qr">
            <img id="whatsappQrImage" src="" alt="WhatsApp chat QR code" />
            <p class="mb-0">Scan this QR code to start a WhatsApp chat.</p>
            <a class="btn" id="whatsappDirectLink" href="https://wa.me/12076803454?text=hi" target="_blank" rel="noopener">Open WhatsApp</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="divicw" data-bind="A0993777-C0CF-4DE8-BF2D-57859A20A5A7" data-org=""></div>

  <button id="notificationSidebarIconTrigger" type="button" data-bs-toggle="offcanvas" data-bs-target="#notificationOffcanvasIndependent" aria-controls="notificationOffcanvasIndependent" aria-label="Open proactive notification">
    <img src="../assets/informationicon.png" alt="" />
  </button>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="notificationOffcanvasIndependent" aria-labelledby="notificationOffcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="notificationOffcanvasLabel">Proactive Notification</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <form id="notificationFormIndependent">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="webhookSelectIndependent">Region</label>
          <select class="form-select" id="webhookSelectIndependent">
            <option value="sg" selected>Singapore</option>
            <option value="us">USA</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="nameSelectIndependent">Customer</label>
          <select class="form-select" id="nameSelectIndependent" required>
            <option value="" disabled selected>Select Customer</option>
            <option value="Christopher">Christopher</option>
            <option value="Shailesh">Shailesh</option>
            <option value="Joshua">Joshua</option>
            <option value="Grace">Grace</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="phoneInputIndependent">Phone Number</label>
          <input class="form-control" id="phoneInputIndependent" placeholder="Auto-filled" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="channelInputIndependent">Channel</label>
          <input class="form-control" id="channelInputIndependent" value="WhatsApp" readonly />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="messageTypeSelectIndependent">Template</label>
          <select class="form-select" id="messageTypeSelectIndependent" required>
            <option value="" disabled selected>Select Template</option>
            <option value="Notification">Notification</option>
            <option value="Offer">Offer</option>
            <option value="Reminder">Reminder</option>
            <option value="Chat">Chat</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Preview</label>
          <div class="notification-preview" id="notificationPreviewIndependent">Select a customer and template to preview the WhatsApp notification.</div>
        </div>

        <button type="submit" class="btn btn-danger w-100" id="sendNotificationButton" disabled>Send WhatsApp Notification</button>
      </form>
      <div id="formStatusIndependent" class="mt-3 fw-semibold" style="display:none;"></div>
    </div>
  </div>

  <script>
    var i = {
      t: function () {
        var e = "https://attachments.apac2.webexengage.com/widget/js/imichatinit.js";
        try {
          var o = new XMLHttpRequest();
          o.onreadystatechange = function () {
            if (this.readyState == 4) {
              var t = document.getElementById("divicw");
              if (this.status == 0) {
                i.o(t);
                return;
              }
              var e = document.createElement("script");
              e.innerHTML = this.responseText;
              t.parentNode.insertBefore(e, t.nextSibling);
            }
          };
          o.open("GET", e, true);
          o.send();
        } catch (s) {
          console.error(s);
        }
      },
      o: function (t) {
        t.insertAdjacentHTML(
          "afterend",
          '<iframe id="tls_al_frm" frameborder="0" style="overflow: hidden; height: 208px; width: 394px; position: fixed; display: block; right: 48px; bottom: 12px; z-index: 99999; display:none;"></iframe>'
        );
        var e = document.getElementById("tls_al_frm");
        var o = e.contentWindow || (e.contentDocument.document || e.contentDocument);
        o.document.open();
        o.document.write(
          '<!doctype html><html><head><meta charset="utf-8"><title>Browser Not Supported</title><style>body{font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #99a0b0; font-size: 14px;}.popover__content{background-color: #fbfbfe; padding: 1.5rem; border-radius: 5px; width: 300px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.26); position: relative;}.popover__message{font-weight: 600; color:#56627c; font-size: 16px;}.pull-left{float: left;}.clearfix{clear: both;}.hdr-txt{width: 218px; margin-top: 3px;}.para-txt a{text-decoration: none; color: #005cde;}.close-btn{position: absolute; right: 15px; top: 15px;}.close-btn a{text-decoration: none; font-weight: 400; color: #56627c; font-size: 16px;}</style></head><body><div class="popover__content"><div class="close-btn"><a href="#" onclick="closeTLSAlert();">X</a></div><div class="popover__message"><div class="pull-left hdr-txt">This browser version is not supported on LiveChat.</div></div><div class="clearfix"></div><p class="para-txt">Please update your browser to the latest version and re-open the website to access the widget. </p></div><script>function closeTLSAlert(){window.parent.postMessage({key: "close_tls_alert", value: "close_tls_alert", action: "close_tls_alert"}, "*");}<\/script></body></html>'
        );
        o.document.close();
        e.style.display = "block";

        window.addEventListener("message", function (t) {
          if (t.data.action == "close_tls_alert") {
            i.s();
          }
        });
      },
      s: function () {
        var t = document.getElementById("tls_al_frm");
        if (t) t.remove();
      },
    };

    i.t();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("contactSidebar");
      sidebar.classList.toggle("expanded");
      const expanded = sidebar.classList.contains("expanded");
      sidebar.setAttribute("aria-expanded", expanded);
      document.querySelector(".sidebar-header").setAttribute("aria-expanded", expanded);
    }

    document.querySelector(".sidebar-header").addEventListener("click", toggleSidebar);
    document.querySelector(".sidebar-header").addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleSidebar();
      }
    });

    document.addEventListener("DOMContentLoaded", function () {
      const tooltipTriggerList = [].slice.call(document.querySelectorAll("[data-bs-toggle='tooltip']"));
      tooltipTriggerList.forEach(function (tooltipTriggerEl) {
        new bootstrap.Tooltip(tooltipTriggerEl);
      });

      const whatsappUrl = "https://wa.me/12076803454?text=hi";
      const qrImage = document.getElementById("whatsappQrImage");
      const qrLink = document.getElementById("whatsappQrLink");
      const qrModalElement = document.getElementById("whatsappQrModal");
      const qrModal = window.bootstrap ? new bootstrap.Modal(qrModalElement) : null;

      qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(whatsappUrl);
      qrLink.addEventListener("click", function (event) {
        event.preventDefault();
        if (qrModal) {
          qrModal.show();
          return;
        }

        qrModalElement.classList.add("show");
        qrModalElement.removeAttribute("aria-hidden");
        qrModalElement.style.display = "block";
      });

      const phoneLookup = {
        Christopher: "6587414102",
        Shailesh: "6598250480",
        Joshua: "6591438487",
        Grace: "6587832760",
      };

      const templateCopy = {
        Notification: "Hi {name}, DBS has an important update for you. Reply here to continue with our Contact Center on WhatsApp.",
        Offer: "Hi {name}, DBS has a new offer available for you. Reply here to connect with our Contact Center on WhatsApp.",
        Reminder: "Hi {name}, this is a DBS reminder. Reply here if you would like help from our Contact Center on WhatsApp.",
        Chat: "Hi {name}, tap here to continue your conversation with our Contact Center on WhatsApp.",
      };

      const nameSelect = document.getElementById("nameSelectIndependent");
      const phoneInput = document.getElementById("phoneInputIndependent");
      const messageTypeSelect = document.getElementById("messageTypeSelectIndependent");
      const notificationPreview = document.getElementById("notificationPreviewIndependent");
      const sendButton = document.getElementById("sendNotificationButton");
      const notificationForm = document.getElementById("notificationFormIndependent");
      const formStatus = document.getElementById("formStatusIndependent");

      function updateNotificationForm() {
        const customerName = nameSelect.value;
        const messageType = messageTypeSelect.value;

        phoneInput.value = phoneLookup[customerName] || "";
        sendButton.disabled = !customerName || !messageType;
        notificationPreview.textContent =
          customerName && messageType
            ? templateCopy[messageType].replace("{name}", customerName)
            : "Select a customer and template to preview the WhatsApp notification.";
      }

      nameSelect.addEventListener("change", updateNotificationForm);
      messageTypeSelect.addEventListener("change", updateNotificationForm);

      notificationForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (sendButton.disabled) return;

        const region = document.getElementById("webhookSelectIndependent").value;
        const webhookUrls = {
          sg: "https://hooks.sg.webexconnect.io/events/CSWMWVJ81X",
          us: "https://hooks.us.webexconnect.io/events/K2PYR77SOP",
        };
        const payload = {
          Name: nameSelect.value,
          Phone: phoneInput.value,
          channel: "WhatsApp",
          messageType: messageTypeSelect.value,
        };

        sendButton.disabled = true;
        sendButton.textContent = "Sending...";
        formStatus.style.display = "none";

        fetch(webhookUrls[region] || webhookUrls.sg, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(function (response) {
            if (!response.ok) throw new Error("Network error");
            return response.text();
          })
          .then(function () {
            formStatus.textContent = "WhatsApp notification sent to " + nameSelect.value + ". Waiting for customer to respond...";
            formStatus.className = "mt-3 fw-semibold text-success";
            formStatus.style.display = "block";
          })
          .catch(function () {
            formStatus.textContent = "Failed to send WhatsApp notification. Please try again.";
            formStatus.className = "mt-3 fw-semibold text-danger";
            formStatus.style.display = "block";
          })
          .finally(function () {
            sendButton.textContent = "Send WhatsApp Notification";
            updateNotificationForm();
          });
      });
    });
  </script>
</body>
</html>
