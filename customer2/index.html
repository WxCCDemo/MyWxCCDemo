<!DOCTYPE html>
<html lang="en" class="demo2">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webex Contact Center Demo - UOB</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Local CSS (same folder) -->
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Optional: Background image scroll */
    .fullscreen-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: auto;
      min-height: 100vh;
      object-fit: cover;
      z-index: 0;
    }
  </style>
</head>
<body class="demo2">

  <!-- Background Image -->
  <img class="fullscreen-image" src="../assets/UOB.png" alt="UOB" />

  <!-- Contact Sidebar -->
  <div class="contact-sidebar" id="contactSidebar">
    <div class="sidebar-header" tabindex="0" role="button" aria-expanded="false" aria-label="Toggle Contact Sidebar">
      <div class="toggle-btn">
        <img src="../assets/ContactUs.png" alt="Contact Us Icon" />
      </div>
      <span class="header-text">Contact Us</span>
    </div>

    <div class="contact-links">
      <a href="tel:+6560478485" class="contact-link" data-bs-toggle="tooltip" title="Call Us">
        <img src="../assets/Phone.jpg" alt="Phone Icon" /> +65 6047 8485
      </a>
      <a href="https://wa.me/12076803464" target="_blank" rel="noopener" class="contact-link" data-bs-toggle="tooltip" title="WhatsApp">
        <img src="../assets/contact-us-whatsapp.jpeg" alt="WhatsApp Icon" /> +1 (207) 680-3454
      </a>
      <a href="mailto:cxdemosc@gmail.com" class="contact-link" data-bs-toggle="tooltip" title="Email">
        <img src="../assets/contact-us-email.jpg" alt="Email Icon" /> sc01customer@gmail.com
      </a>
      <a href="#" class="contact-link" data-bs-toggle="tooltip" title="Office Address">
        <img src="../assets/adresspin.png" alt="Address Icon" /> 80, Pasir Panjang Road
      </a>
      <a href="#" class="contact-link" data-bs-toggle="tooltip" title="Back to Home" id="openVideoCall">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera-video-fill" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2z"/>
</svg> Video Call
      </a>
      <a href="../index.html" class="contact-link" data-bs-toggle="tooltip" title="Back to Home">
        <img src="../assets/webex-logo.png" alt="Webex Home" /> Webex
      </a>
    </div>
  </div>

  <div id="video-call-container" class="text-center my-3">
    <iframe
      id="videoCallFrame"
      style="display:none; width:100%; height:500px; border:none;"
      allow="camera; microphone; fullscreen; clipboard-read; clipboard-write; autoplay; encrypted-media"
      allowfullscreen
      scrolling="yes">
    </iframe>
  </div>

  <!-- Live Chat Widget Container -->
  <div id="live-chat-container"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Local Script -->
  <script src="script.js"></script>

    <!-- Video Call Button and Frame -->
  
  
</body>
</html>
