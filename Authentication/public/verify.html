<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBS Bank Verification</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f9;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d5dee8;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 18px 48px rgba(28, 42, 58, 0.12);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 86px;
        height: auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        color: #536273;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-top: 18px;
        font-size: 13px;
        font-weight: 700;
        color: #445365;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        border: 1px solid #bcc8d6;
        border-radius: 6px;
        padding: 13px;
        font-size: 22px;
        letter-spacing: 4px;
        text-align: center;
      }

      button {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 6px;
        background: #d71920;
        color: #ffffff;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 750;
        cursor: pointer;
      }

      .result {
        margin-top: 16px;
        border-radius: 6px;
        background: #f6f8fb;
        padding: 12px;
        min-height: 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/dbs_logo.svg" alt="DBS Bank" />
      </div>
      <h1>DBS Bank Verification</h1>
      <p>Enter the verification code sent to your registered mobile number. Do not share this code in chat or with the virtual agent.</p>

      <label for="otp">Verification code</label>
      <input id="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code" autofocus />

      <button id="submit">Verify</button>
      <div class="result" id="result"></div>
    </main>

    <script src="/config.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id");
      const result = document.querySelector("#result");
      const otp = document.querySelector("#otp");

      document.querySelector("#submit").addEventListener("click", async () => {
        const verifyUrl = window.WEBEX_CONNECT_VERIFY_URL;
        if (!id) {
          result.textContent = "This verification link is missing an ID. Please ask the agent to send a new link.";
          return;
        }

        if (!verifyUrl) {
          result.textContent = "Verification endpoint is not configured.";
          return;
        }

        const response = await fetch(verifyUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ verification_id: id, otp: otp.value })
        });
        const payload = await response.json();

        if (payload.verification_status === "verified") {
          result.textContent = "Verification complete. You may return to the banking conversation.";
          otp.disabled = true;
        } else if (payload.verification_status === "pending") {
          result.textContent = `Code not verified. ${payload.remaining_attempts || 0} attempts remaining.`;
        } else {
          result.textContent = "Verification failed. Please return to the banking conversation.";
          otp.disabled = true;
        }
      });
    </script>
  </body>
</html>
